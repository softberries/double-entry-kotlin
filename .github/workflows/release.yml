# Release (M-017): replaces the gem's `rake release[remote]` (bundler gem tasks, Rakefile:2).
#   release:guard_clean            -> a tag always points at a committed tree; nothing to check
#   release:source_control_push    -> the maintainer pushes the tag `vX.Y.Z` (it triggers this workflow)
#   release:rubygem_push           -> publish the Maven publication to GitHub Packages of this repository
# Runs only for tags `v*`; any other ref (branches, pull requests, other tags) never starts it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Derive the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z (optionally with a pre-release suffix); nothing is published."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The full build (ktlint, all tests incl. PublicationTest) must pass before anything is published.
      - name: Build and publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew build :double-entry:publishMavenPublicationToGitHubPackagesRepository
          -Pversion=${{ steps.version.outputs.version }} --no-daemon --max-workers=2
